apiVersion: data.packaging.carvel.dev/v1alpha1
kind: Package
metadata:
  name: scdf.tanzu.japan.com.2.1.3
spec:
  refName: scdf.tanzu.japan.com
  version: 2.1.3
  valuesSchema:
    openAPIv3:
      title: scdf.tanzu-jp values schema
      properties:
        namespace:
          type: string
          default: default
        ingress:
          type: object
          additionalProperties: false
          properties:
            enabled:
              type: boolean
              default: true
            domain:
              type: string
              default: dataflow.example.com
        repo:
          type: object
          additionalProperties: false
          properties:
            url:
              type: string
              default: tanzu-dataflow.packages.broadcom.com/dataflow
            user:
              type: string
              default: ""
            password:
              type: string
              default: ""
        version:
          type: string
          default: 2.1.3
  template:
    spec:
      fetch:
      - git:
          url: https://github.com/mhoshi-vm/tap-carvel
          ref: origin/pkgr
          subPath: manifests/scdf.tanzu.japan.com/2.1.3
      template:
        - ytt:
            valuesFrom:
              - downwardAPI:
                  items:
                    - name: namespace
                      fieldPath: metadata.namespace
      deploy:
      - kapp: {}
