            url:
              type: string
              default: registry.packages.broadcom.com
            user:
              type: string
              default: ""
            password:
              type: string
              default: ""
        version:
          type: string
          default: 1.6.6
        task_runner_version:
          type: string
          default: 2.11.8
  template:
    spec:
      fetch:
      - git:
          url: https://github.com/mhoshi-vm/tap-carvel
          ref: origin/pkgr
          subPath: manifests/scdf.tanzu.japan.com/1.6.6
      template:
        - ytt:
            valuesFrom:
              - downwardAPI:
