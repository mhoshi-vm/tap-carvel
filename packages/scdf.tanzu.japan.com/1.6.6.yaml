apiVersion: data.packaging.carvel.dev/v1alpha1
kind: Package
metadata:
  name: scdf.tanzu.japan.com.1.6.6
spec:
  refName: scdf.tanzu.japan.com
  version: 1.6.6
  valuesSchema:
    openAPIv3:
      title: scdf.tanzu-jp values schema
      properties:
        namespace:
          type: string
          default: default
        postgres:
          type: object
