apiVersion: data.packaging.carvel.dev/v1alpha1
kind: Package
metadata:
  name: etcd.tanzu.japan.com.1.0.0
spec:
  refName: etcd.tanzu.japan.com
  version: 1.0.0
  valuesSchema:
    openAPIv3:
      title: etcd.tanzu-jp values schema
      properties:
        image:
          type: string
          default: quay.io/coreos/etcd:v3.5.21
        replicas:
          type: integer
          default: 3
        namespace:
          type: string
          default: default
        tls:
          type: boolean
          default: true
  template:
    spec:
      fetch:
      - git:
          url: https://github.com/mhoshi-vm/tap-carvel
          ref: origin/pkgr
          subPath: manifests/etcd.tanzu.japan.com/1.0.0
      template:
      - ytt:
          valuesFrom:
            - downwardAPI:
                items:
                  - name: namespace
                    fieldPath: metadata.namespace
      deploy:
      - kapp: {}
