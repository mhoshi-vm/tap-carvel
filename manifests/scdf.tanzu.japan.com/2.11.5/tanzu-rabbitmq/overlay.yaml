#@ load("@ytt:data", "data")
#@ load("@ytt:overlay", "overlay")


#@ if data.values.rabbitmq.enabled:
#@ if data.values.rabbitmq.package.install:
apiVersion: v1
kind: Namespace
metadata:
  name: rabbitmq-install
  labels:
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Secret
metadata:
  name: scdf-registry
  namespace: rabbitmq-install
  annotations:
    secretgen.carvel.dev/image-pull-secret: ""
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: e30K
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kapp-sa
  namespace: rabbitmq-install
secrets:
  - name: scdf-registry
imagePullSecrets:
  - name: scdf-registry
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: rabbit-kapp-role-binding
  namespace: rabbitmq-install
subjects:
- kind: ServiceAccount
  name: kapp-sa
  namespace: rabbitmq-install
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
apiVersion: packaging.carvel.dev/v1alpha1
kind: PackageRepository
metadata:
  generation: 2
  name: tmq-pack
  namespace: rabbitmq-install
  annotations:
    kapp.k14s.io/change-group: "pkgr"
spec:
  fetch:
    imgpkgBundle:
      image: #@ data.values.rabbitmq.package.repo + ":" + data.values.rabbitmq.package.version
---
apiVersion: packaging.carvel.dev/v1alpha1
kind: PackageInstall
metadata:
  name: rabbitmq
  namespace: rabbitmq-install
  annotations:
    kapp.k14s.io/change-rule: "upsert after upserting pkg-cert"
    ext.packaging.carvel.dev/ytt-paths-from-secret-name.0: "namespace-overlay"
spec:
  serviceAccountName: kapp-sa 
  packageRef:
    refName: rabbitmq.tanzu.vmware.com
    versionSelection:
      constraints: #@ data.values.rabbitmq.package.operator_version
---
apiVersion: v1
kind: Secret
metadata:
  name: namespace-overlay
  namespace: rabbitmq-install
stringData:
  overlay.yaml: |
    #@ load("@ytt:overlay", "overlay")
    
    #@overlay/match by=overlay.subset({"kind":"Namespace", "metadata": {"name": "rabbitmq-system"}}), expects="0+"
    ---
    metadata:
      labels:
        #@overlay/match missing_ok=True
        pod-security.kubernetes.io/enforce: baseline
#@ end
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rabbitmqclusters.rabbitmq.com
  annotations:
    kapp.k14s.io/exists: ""
    kapp.k14s.io/change-group: "tkcrd"
spec:
  group: rabbitmq.com
  versions:
    - name: v1beta1
  names:
    kind: RabbitmqCluster
  scope: Namespaced
#@ count = data.values.rabbitmq.count + 1
#@ for j in range(1,count):
---
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: #@ "rmq-" + str(j)
  namespace: scdf
  annotations:
    kapp.k14s.io/change-rule: "upsert after upserting tkcrd"
spec:
  imagePullSecrets:
  - name: scdf-registry
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 250Mi
  rabbitmq:
    additionalPlugins:
      - rabbitmq_shovel
      - rabbitmq_shovel_management
      - rabbitmq_management
      - rabbitmq_prometheus
      - rabbitmq_peer_discovery_k8s
#@ end
#@ end
