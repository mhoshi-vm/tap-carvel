#@ load("@ytt:data", "data")
#@ load("@ytt:overlay", "overlay")

---
apiVersion: data.packaging.carvel.dev/v1alpha1
kind: Package
metadata:
  name: scdf-pro.tanzu.vmware.com.1.6.4
spec:
  refName: scdf-pro.tanzu.vmware.com
  publicName: scdf-pro.tanzu.vmware.com
  version: 1.6.4
  description: Package for SCDF
  releasedAt: "2024-09-15T06:41:27Z"
  valuesSchema:
    openAPIv3:
      type: object
      title: scdf values schema
      description: Schema for carvel package
      properties:
        scdf:
          type: object
          properties:
            registry:
              type: object
              properties:
                secret:
                  type: object
                  properties:
                    ref:
                      type: string
                      description: If defined a reference will be added as imagePullSecret to all services, otherwise carvel secretgen is added
            server:
              type: object
              properties:
                image:
                  type: object
                  properties:
                    repository:
                      type: string
                      description: Composed Task Runner image repository
                    tag:
                      type: string
                      description: Composed Task Runner image tag
                    digest:
                      type: string
                      description: Composed Task Runner image digest
                database:
                  type: object
                  properties:
                    url:
                      type: string
                      description: Datasource url setting
                    username:
                      type: string
                      description: Datasource username setting
                    password:
                      type: string
                      description: Datasource password setting
                    driverClassName:
                      type: string
                      description: Datasource driverClassName setting
                    validationQuery:
                      type: string
                      description: Datasource validationQuery setting
                    testOnBorrow:
                      type: boolean
                      default: true
                      description: Datasource testOnBorrow setting
                    secretName:
                      type: string
                      description: Name of Kubernetes secret containing database credentials
                    secretUsernameKey:
                      type: string
                      description: Name of secret key for username
                    secretPasswordKey:
                      type: string
                      description: Name of secret key for password
                service:
                  type: object
                  properties:
                    type:
                      type: string
                      default: ClusterIP
                      enum:
                        - NodePort
                        - LoadBalancer
                        - ClusterIP
                        - ExternalName
                      description: Service type
                    allocateLoadBalancerNodePorts:
                      type: boolean
                      description: Indicates if load balancer should create node ports. Default is true
                    loadBalancerClass:
                      type: string
                      description: Determines a specific configured type of load balancer.
                resources:
                  type: object
                  properties:
                    limits:
                      type: object
                      properties:
                        cpu:
                          type: string
                          description: Limits cpu setting
                        memory:
                          type: string
                          description: Limits memory setting
                    requests:
                      type: object
                      properties:
                        cpu:
                          type: string
                          description: Requests cpu setting
                        memory:
                          type: string
                          description: Requests memory setting
                config:
                  type: string
                  description: Raw server config as yml
                env:
                  type: array
                  description: Extra environment variables for container
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Name of environment variable
                      value:
                        type: string
                        description: Value of environment variable
                metrics:
                  type: object
                  properties:
                    dashboard:
                      type: object
                      properties:
                        url:
                          type: string
                          description: Metrics dashboard url for UI
                contextPath:
                  type: string
                  description: Server context path, aka server.servlet.context-path
            skipper:
              type: object
              properties:
                image:
                  type: object
                  properties:
                    repository:
                      type: string
                      description: Composed Task Runner image repository
                    tag:
                      type: string
                      description: Composed Task Runner image tag
                    digest:
                      type: string
                      description: Composed Task Runner image digest
                database:
                  type: object
                  properties:
                    url:
                      type: string
                      description: Datasource url setting
                    username:
                      type: string
                      description: Datasource username setting
                    password:
                      type: string
                      description: Datasource password setting
                    driverClassName:
                      type: string
                      description: Datasource driverClassName setting
                    validationQuery:
                      type: string
                      description: Datasource validationQuery setting
                    testOnBorrow:
                      type: boolean
                      default: true
                      description: Datasource testOnBorrow setting
                    secretName:
                      type: string
                      description: Name of Kubernetes secret containing database credentials
                    secretUsernameKey:
                      type: string
                      description: Name of secret key for username
                    secretPasswordKey:
                      type: string
                      description: Name of secret key for password
                service:
                  type: object
                  properties:
                    type:
                      type: string
                      default: ClusterIP
                      enum:
                        - NodePort
                        - LoadBalancer
                        - ClusterIP
                        - ExternalName
                      description: Service type
                    allocateLoadBalancerNodePorts:
                      type: boolean
                      description: Indicates if load balancer should create node ports. Default is true
                    loadBalancerClass:
                      type: string
                      description: Determines a specific configured type of load balancer.
                resources:
                  type: object
                  properties:
                    limits:
                      type: object
                      properties:
                        cpu:
                          type: string
                          description: Limits cpu setting
                        memory:
                          type: string
                          description: Limits memory setting
                    requests:
                      type: object
                      properties:
                        cpu:
                          type: string
                          description: Requests cpu setting
                        memory:
                          type: string
                          description: Requests memory setting
                config:
                  type: string
                  description: Raw server config as yml
                env:
                  type: array
                  description: Extra environment variables for container
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Name of environment variable
                      value:
                        type: string
                        description: Value of environment variable
            ctr:
              type: object
              properties:
                image:
                  type: object
                  properties:
                    repository:
                      type: string
                      default: springcloud/spring-cloud-dataflow-composed-task-runner
                      description: Composed Task Runner image repository
                    tag:
                      type: string
                      description: Composed Task Runner image tag
                    digest:
                      type: string
                      description: Composed Task Runner image digest
            binder:
              type: object
              properties:
                kafka:
                  type: object
                  properties:
                    broker:
                      type: object
                      properties:
                        host:
                          type: string
                          description: External kafka broker host
                        port:
                          type: string
                          description: External kafka broker port
                    zk:
                      type: object
                      properties:
                        host:
                          type: string
                          description: External kafka zk host
                        port:
                          type: string
                          description: External kafka zk port
                rabbit:
                  type: object
                  properties:
                    host:
                      type: string
                      description: External rabbit host
                    port:
                      type: string
                      description: External rabbit port
                    username:
                      type: string
                      description: External rabbit username
                    password:
                      type: string
                      description: External rabbit password
            feature:
              type: object
              properties:
                monitoring:
                  type: object
                  properties:
                    prometheusRsocketProxy:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: false
                          description: Enables prometheus rsocket proxy feature
                    grafana:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: false
                          description: Enables grafana feature
  template:
    spec:
      syncPeriod: 5m
      fetch:
        - imgpkgBundle:
            image: #@ data.values.scdf.package.base_repo + "/scdf-pro-package:" + data.values.scdf.package.version
      template:
        - ytt:
            ignoreUnknownComments: true
            paths:
              - config/
        - kbld:
            paths:
              - '-'
      deploy:
        - kapp:
            rawOptions:
              - --wait-timeout=10m