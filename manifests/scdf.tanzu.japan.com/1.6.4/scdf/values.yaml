#@ load("@ytt:data", "data")
#@ load("@ytt:struct", "struct")
#@ load("@ytt:yaml", "yaml")

#@ def scdf_values():
scdf:
  binder:
    type: rabbit
    rabbit:
      host: rmq-1.scdf
  ctr:
    image:
      repository: #@ data.values.scdf.package.base_repo + "/spring-cloud-dataflow-composed-task-runner"
      digest: #@ data.values.scdf.package.digest.ctr
  server:
    image:
      repository: #@ data.values.scdf.package.base_repo + "/scdf-pro-server"
      digest: #@ data.values.scdf.package.digest.server
    service:
      type: LoadBalancer
    env:
      - name: SPRING_CLOUD_DATAFLOW_FEATURES_STREAMS_ENABLED
        value: "true"
      - name: SPRING_CLOUD_DATAFLOW_FEATURES_TASKS_ENABLED
        value: "true"
      - name: SPRING_CLOUD_DATAFLOW_FEATURES_SCHEDULES_ENABLED
        value: "true"
    database:
      url: jdbc:postgresql://postgres-11.scdf:5432/postgres-11
      driverClassName: org.postgresql.Driver
      secretName: postgres-11-app-user-db-secret
      secretUsernameKey: username
      secretPasswordKey: password
  skipper:
    image:
      repository: #@ data.values.scdf.package.base_repo + "/scdf-pro-skipper"
      digest: #@ data.values.scdf.package.digest.skipper
    database:
      url: jdbc:postgresql://postgres-11.scdf:5432/postgres-11
      driverClassName: org.postgresql.Driver
      secretName: postgres-11-app-user-db-secret
      secretUsernameKey: username
      secretPasswordKey: password
  registry:
    secret:
      ref: "scdf-registry"
#@ end
---
apiVersion: v1
kind: Secret
metadata:
  name: scdf-values
  namespace: scdf
stringData:
  values.yaml: #@ yaml.encode(scdf_values())