#@ load("@ytt:data", "data")
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rabbitmqclusters.rabbitmq.com
  annotations:
    kapp.k14s.io/exists: ""
    kapp.k14s.io/change-group: "tkcrd"
spec:
  group: rabbitmq.com
  versions:
    - name: v1beta1
      served: true
      storage: true
  names:
    kind: RabbitmqCluster
    plural: rabbitmqclusters
  scope: Namespaced
#@ count = data.values.rabbitmq.count + 1
#@ for j in range(1,count):
---
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: #@ "rmq-" + str(j)
  namespace: #@ data.values.namespace
  annotations:
    kapp.k14s.io/change-group: "rmq"
spec:
  imagePullSecrets:
    - name: repo-secret
  override:
    statefulSet:
      spec:
        template:
          spec:
            containers:
              - name: rabbitmq
                resources: { }
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: [ "ALL" ]
            initContainers:
              - name: setup-container
                resources: { }
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: [ "ALL" ]
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 250Mi
  rabbitmq:
    additionalConfig: |
      loopback_users = none
    additionalPlugins:
      - rabbitmq_shovel
      - rabbitmq_shovel_management
      - rabbitmq_management
      - rabbitmq_prometheus
      - rabbitmq_peer_discovery_k8s
#@ end