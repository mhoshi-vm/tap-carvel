#@ load("@ytt:data", "data")
#@ load("@ytt:overlay", "overlay")
#@ load("@ytt:base64", "base64")
#@ load("@ytt:json", "json")


#@ def dockerhub_config_fragment(user, password):
username: #@ user
password: #@ password
#@ end

#@ def dockerhub_config(url, user, password):
#@ docker_config = { url.partition("/")[0] : dockerhub_config_fragment(user, password)}
auths: #@ docker_config
#@ end
---
apiVersion: v1
kind: Namespace
metadata:
  name: tpk8s-toolkit
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-repo-secret
  namespace: tpk8s-toolkit
type: kubernetes.io/dockerconfigjson
#@ repo = data.values.rabbitmq.package.repo
data:
  #@ url = repo.url
  #@ user = repo.user
  #@ password = repo.password
  .dockerconfigjson: #@ base64.encode(json.encode(dockerhub_config(url, user, password)))
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-repo-secret
  namespace: tpk8s-toolkit
type: kubernetes.io/dockerconfigjson
#@ repo = data.values.postgres.package.repo
data:
  #@ url = repo.url
  #@ user = repo.user
  #@ password = repo.password
  .dockerconfigjson: #@ base64.encode(json.encode(dockerhub_config(url, user, password)))
---
apiVersion: v1
kind: Secret
metadata:
  name: gemfire-repo-secret
  namespace: tpk8s-toolkit
type: kubernetes.io/dockerconfigjson
#@ repo = data.values.gemfire.package.repo
data:
  #@ url = repo.url
  #@ user = repo.user
  #@ password = repo.password
  .dockerconfigjson: #@ base64.encode(json.encode(dockerhub_config(url, user, password)))
---
apiVersion: secretgen.carvel.dev/v1alpha1
kind: SecretExport
metadata:
  name: postgres-repo-secret
  namespace: tpk8s-toolkit
spec:
  toNamespaces:
   - "*"
---
apiVersion: secretgen.carvel.dev/v1alpha1
kind: SecretExport
metadata:
  name: rabbitmq-repo-secret
  namespace: tpk8s-toolkit
spec:
  toNamespaces:
    - "*"
---
apiVersion: secretgen.carvel.dev/v1alpha1
kind: SecretExport
metadata:
  name: gemfire-repo-secret
  namespace: tpk8s-toolkit
spec:
  toNamespaces:
    - "*"