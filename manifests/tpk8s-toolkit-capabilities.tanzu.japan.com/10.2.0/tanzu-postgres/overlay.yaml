#@ load("@ytt:data", "data")
#@ load("@ytt:overlay", "overlay")

#@ if data.values.postgres.package.install:
apiVersion: v1
kind: Namespace
metadata:
  labels:
    pod-security.kubernetes.io/enforce: baseline
  name: postgres-install
---
apiVersion: v1
kind: Secret
metadata:
  name: tap-registry
  namespace: postgres-install
  annotations:
    secretgen.carvel.dev/image-pull-secret: ""
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: e30K
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kapp-sa
  namespace: postgres-install
secrets:
  - name: tap-registry
imagePullSecrets:
  - name: tap-registry
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: postgres-kapp-role-binding
  namespace: postgres-install
subjects:
- kind: ServiceAccount
  name: kapp-sa
  namespace: postgres-install
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
apiVersion: kappctrl.k14s.io/v1alpha1
kind: App
metadata:
  name: postgres-helm
  namespace: postgres-install
spec:
  serviceAccountName: kapp-sa
  fetch:
    - imgpkgBundle:
        image:  #@ data.values.postgres.package.repo.url + ":" + data.values.postgres.package.version
        secretRef:
          name: tap-registry
  template:
    - helmTemplate:
        path: /
        valuesFrom:
          - secretRef:
              name: change-default-reg-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: change-default-reg-secret
  namespace: postgres-install
stringData:
  change-default-reg-secret.yml: | 
    dockerRegistrySecretName: tap-registry
#@ end


