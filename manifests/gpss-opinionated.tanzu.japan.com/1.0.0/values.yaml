#@data/values-schema
---
name: gpfdist

image: harbor.tp.aws.lespaulstudioplus.info/gpss/gp-stream-server-instance-gpdb7:2.0.1
replicas: 3
resource:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: "0.3"
    memory: 256Mi

namespace: gpss
tls:
  enabled: false
rabbitmq:
  enabled: true
  contour:
    enabled: true
    domain: example.com
