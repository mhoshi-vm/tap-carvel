#@ load("@ytt:data", "data")
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kapp-sa
  namespace: #@ data.values.namespace
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: tmc-kapp-role-binding
  namespace: #@ data.values.namespace
subjects:
  - kind: ServiceAccount
    name: kapp-sa
    namespace: tmc-local
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
apiVersion: packaging.carvel.dev/v1alpha1
kind: PackageInstall
metadata:
  name: etcd
  namespace: #@ data.values.namespace
spec:
  serviceAccountName: kapp-sa
  packageRef:
    refName: etcd.tanzu.japan.com
    versionSelection:
      constraints: ">0.0.0"
  values:
  - secretRef:
      name: etcd-values
      key: values.yml
---
apiVersion: v1
kind: Secret
metadata:
  name: etcd-values
  namespace: #@ data.values.namespace
stringData:
  values.yml: |
    tls:
      enabled: false