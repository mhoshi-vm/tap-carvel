#@ load("@ytt:data", "data")
#@ load("@ytt:base64", "base64")

---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: rmq-root-issuer
  namespace: #@ data.values.namespace
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rmq01
  namespace: #@ data.values.namespace
spec:
  secretName: rmq01-tls
  issuerRef:
    name: rmq-root-issuer
    kind: Issuer
  commonName: rmq01
  dnsNames:
  #@ for config in [ [ "amqp", "tcp", 5672 ], [ "console", "http", 15672], ["stream", "tcp", 5552] ]:
  - #@ "rmq01-{}.{}".format(config[0], data.values.rabbitmq.contour.domain)
  #@ end