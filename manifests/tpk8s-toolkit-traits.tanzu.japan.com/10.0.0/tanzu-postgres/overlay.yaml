#@ load("@ytt:data", "data")
#@ load("@ytt:overlay", "overlay")

#@ count = data.values.postgres.count + 1
#@ for j in range(1,count):
---
apiVersion: sql.tanzu.vmware.com/v1
kind: Postgres
metadata:
  name: #@ "postgres-1" + str(j)
spec:
  resources:
    data:
      requests:
        memory: 400Mi
        cpu: "0.4"
  storageSize: 10G
  storageClassName: #@ data.values.postgres.storage_class
  monitorStorageClassName: #@ data.values.postgres.storage_class
  postgresVersion:
    name: #@ data.values.postgres.instance_version
  highAvailability:
    enabled: false
---
#! https://vmw-jira.broadcom.net/browse/POSTGRES-157
apiVersion: v1
kind: Service
metadata:
  name: #@ "postgres-1" + str(j) + "-agent-dummy"
spec:
  clusterIP: None
  selector:
    headless-service: #@ "postgres-1" + str(j)
  type: ClusterIP
  ports:
    - port: 5432
      protocol: TCP
      targetPort: 5432
#@ end

