#@ load("@ytt:data", "data")
#@ load("@ytt:overlay", "overlay")

#@ if data.values.gmc.install:
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gmc-sa
  namespace: #@ data.values.namespace
secrets:
  - name: repo-secret
imagePullSecrets:
  - name: repo-secret
---
apiVersion: v1
kind: Service
metadata:
  name: gmc-service
  namespace: #@ data.values.namespace
spec:
  selector:
    app: gmc
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  type: LoadBalancer
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gmc
  namespace: #@ data.values.namespace
spec:
  selector:
    matchLabels:
      app: gmc
  serviceName: "gmc-service"
  replicas: 1
  template:
    metadata:
      labels:
        app: gmc
    spec:
      terminationGracePeriodSeconds: 10
      serviceAccountName: gmc-sa
      securityContext:
        fsGroup: 1000
      containers:
        - name: gmc
          image: #@ data.values.gmc.repo.url + ":" + data.values.gmc.version
          ports:
            - containerPort: 8080
              name: gmc
          volumeMounts:
            - name: gmc
              mountPath: /opt/gemfire/VMware_GemFire_Management_Console
          env:
            - name: server.port
              value: "8080"
            - name: GMC_WEBSOCKET_SENDBUFFERSIZELIMIT
              value: "5120000"
            - name: PROMETHEUS_SCRAPE_INTERVAL
              value: "2s"

  volumeClaimTemplates:
    - metadata:
        annotations:
          name: gmc
          kapp.k14s.io/owned-for-deletion: ""
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 4Gi
#@ end