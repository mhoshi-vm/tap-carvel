#@ load("@ytt:data", "data")
#@ load("@ytt:base64", "base64")

#@ port = 636 if data.values.openldap.ssl else 389
#@ containerPort = port + 1000
#@ if data.values.openldap.enabled:
---
apiVersion: v1
kind: Namespace
metadata:
  name: openldap
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: openldap
  name: openldap
  namespace: openldap
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openldap
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openldap
    spec:
      volumes:
        - name: openldap-ldif
          secret:
            secretName: openldap-ldif
        #@ if data.values.openldap.ssl:
        - name: certifcate
          secret:
            secretName: openldap-cert
        #@ end
      containers:
      - env:
        - name: LDAP_ROOT
          value: #@ data.values.openldap.rootdn
        - name: LDAP_ADMIN_USERNAME
          value: admin
        - name: LDAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: adminpassword
              name: openldap
        #@ if data.values.openldap.ssl:
        - name: LDAP_ENABLE_TLS
          value: "yes"
        - name: LDAP_TLS_CERT_FILE
          value: /tls/tls.crt
        - name: LDAP_TLS_KEY_FILE
          value: /tls/tls.key
        - name: LDAP_TLS_CA_FILE
          value: /tls/ca.crt
        #@ end
        image: #@ data.values.openldap.image
        imagePullPolicy: Always
        name: openldap
        ports:
        - containerPort: #@ containerPort
          name: tcp-ldap
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
          - mountPath: "/ldifs"
            name: openldap-ldif
            readOnly: true
          #@ if data.values.openldap.ssl:
          - mountPath: "/tls"
            name: certifcate
            readOnly: true
          #@ end
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: openldap
  name: openldap
  namespace: openldap
spec:
  ports:
  - name: tcp-ldap
    port: #@ port
    targetPort: tcp-ldap
  selector:
    app.kubernetes.io/name: openldap
  type: ClusterIP
---
apiVersion: v1
data:
  adminpassword: #@ base64.encode(data.values.openldap.adminpassword)
kind: Secret
metadata:
  name: openldap
  namespace: openldap
---
apiVersion: v1
data:
  custom.ldif: #@ base64.encode(data.values.openldap.ldif)
kind: Secret
metadata:
  creationTimestamp: null
  name: openldap-ldif
  namespace: openldap

#@ if data.values.openldap.ssl:
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
 name: openldap-root-issuer
 annotations:
   kapp.k14s.io/change-group: "secrettemplate"
spec:
 selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
 name: openldap-rootca
 namespace: openldap
 annotations:
   kapp.k14s.io/change-group: "secrettemplate"
spec:
  isCA: true
  commonName: openldap-rootca
  secretName: openldap-rootca
  issuerRef:
    name: openldap-root-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: openldap-ca-issuer
  annotations:
    kapp.k14s.io/change-group: "secrettemplate"
spec:
  ca:
    secretName: openldap-rootca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openldap-cert
  namespace: openldap
  annotations:
    kapp.k14s.io/change-group: "secrettemplate"
spec:
  secretName: openldap-cert
  isCA: false
  usages:
    - server auth
    - client auth
  dnsNames:
  - #@ "openldap.openldap.svc.cluster.local"
  - "openldap"
  issuerRef:
    name: openldap-ca-issuer
---
apiVersion: secretgen.carvel.dev/v1alpha1
kind: SecretExport
metadata:
  name: openldap-cert
  namespace: openldap
  annotations:
    kapp.k14s.io/change-group: "secrettemplate"
spec:
  toNamespace: tmc-local
---
apiVersion: secretgen.carvel.dev/v1alpha1
kind: SecretImport
metadata:
  name: openldap-cert
  namespace: tmc-local
  annotations:
    kapp.k14s.io/change-group: "secrettemplate"
spec:
  toNamespace: openldap
#@ end
#@ end
