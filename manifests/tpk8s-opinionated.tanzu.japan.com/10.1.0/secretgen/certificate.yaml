#@ load("@ytt:data", "data")
#@ if data.values.tp.ingress.self_signed_cert:
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: issuers.cert-manager.io
  annotations:
    kapp.k14s.io/exists: ""
    kapp.k14s.io/change-rule: "upsert after upserting pkg-cert"
spec:
  group: cert-manager.io
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
  names:
    kind: Issuer
    plural: issuers
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: certificates.cert-manager.io
  annotations:
    kapp.k14s.io/exists: ""
    kapp.k14s.io/change-rule: "upsert after upserting pkg-cert"
spec:
  group: cert-manager.io
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
  names:
    kind: Certificate
    plural: certificates
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: tp-root-issuer
  namespace: #@ data.values.tp.namespace
  annotations:
    kapp.k14s.io/change-group: "secrettemplate"
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tp-cert
  namespace: #@ data.values.tp.namespace
  annotations:
    kapp.k14s.io/change-group: "secrettemplate"
spec:
  isCA: true
  commonName: #@ data.values.tp.ingress.host
  secretName: tp-cert
  dnsNames:
    - localhost
    - #@ data.values.tp.ingress.host
    - #@ "*." + data.values.tp.ingress.host
  issuerRef:
    name: tp-root-issuer
    kind: Issuer
    group: cert-manager.io
  privateKey:
    encoding: PKCS8
    size: 4096
  usages:
    - digital signature
    - key encipherment
    - cert sign
    - server auth
#@ else:
---
apiVersion: v1
kind: Secret
metadata:
  name: tp-cert
  namespace: #@ data.values.tp.namespace
  annotations:
    kapp.k14s.io/change-group: "secrettemplate"
type: Opaque
stringData:
  tls.crt: #@ data.values.tp.ingress.certificate
  tls.key: #@ data.values.tp.ingress.privateKey
#@ end