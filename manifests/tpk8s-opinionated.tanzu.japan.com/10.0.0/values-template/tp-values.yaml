#@ load("@ytt:data", "data")
#@ load("@ytt:yaml", "yaml")
---
#@ def tp_values():
flavor: #@ data.values.tp.flavor
profile: #@ data.values.tp.profile
version: #@ data.values.tp.version
ingress:
  host: #@ data.values.tp.ingress.host
deployment:
  airGapped: false
trivy:
  dbRepository: ""
  allowInsecureConnections: false
postgresql:
  storageClass: #@ data.values.tp.storage_class
clickhouse:
  storageClass: #@ data.values.tp.storage_class
redis:
  storageClass: #@ data.values.tp.storage_class
  password: ""
opensearch:
  storageClass: #@ data.values.tp.storage_class
seaweedfsS3:
  storageClass: #@ data.values.tp.storage_class
prometheus:
  storageClass: #@ data.values.tp.storage_class
  tmcStorageClass: #@ data.values.tp.storage_class
kafka:
  storageClass: #@ data.values.tp.storage_class
zookeeper:
  storageClass: #@ data.values.tp.storage_class
imageRegistry: #@ data.values.tp.imageRegistry
login:
  timeout: 300
  #@ if data.values.tp.ldap_enabled:
  #@ admin_dn = "cn=admin," + data.values.openldap.rootdn
  #@ user_dn = "ou=" + data.values.openldap.group + "," + data.values.openldap.rootdn
  ldap:
    url: 'ldap://openldap.openldap:389/'
    credentials:
      userDN: #@ admin_dn
      password: #@ data.values.openldap.adminpassword
    users:
      baseDN: #@ user_dn
      searchFilter: '(objectClass=posixAccount)'
      mailAttribute: mail
    groups:
      baseDN: #@ user_dn
      searchFilter: '(objectClass=groupOfNames)'
      groupNameAttribute: cn
      searchDepth: 10
  #@ end
  oauthProviders: #@ data.values.tp.oauthProviders
organization:
  name: #@ data.values.tp.organization.name
internal:
  #@ var=[]
  #@ if data.values.tp.salt_disabled:
  #@   for component in [ "raas", "idem-helm", "guardrails-helm" ]:
  #@     var.append(component)
  #@   end
  #@ end
  #@ if data.values.tp.salt_disabled:
  #@   for component in [ "vcf-ingestion-service" ]:
  #@     var.append(component)
  #@   end
  #@ end
  excludedComponents: #@ var
cas:
  encryptionKeyVersion: 1
namespace: tanzusm
uaa:
  oauthClients:
    tp_app:
      grantTypes: password,authorization_code,client_credentials,refresh_token
      authorities: scim.write,scim.read,roles,ensemble:admin,ensemble:viewer
      scope: openid,ensemble:admin,ensemble:viewer,roles
      autoapprove: openid,ensemble:admin,ensemble:viewer,roles
      tileEnabled: "true"
      launchUrl: #@ "https://" + data.values.tp.ingress.host + "/hub"
      launchIcon: 
      accessTokenValidity: "1800"
    tp_cli_app:
      grantTypes: password,authorization_code,client_credentials,refresh_token
      authorities: roles,ensemble:admin,ensemble:viewer
      scope: openid,ensemble:admin,ensemble:viewer,roles
      autoapprove: openid,ensemble:admin,ensemble:viewer,roles
      pkceEnabled: "true"
      redirectUri: http://127.0.0.1:*/**
    ensemble_user_service:
      secret: sZ_T10QqaFvQHS_1JZvx
      grantTypes: password,authorization_code,client_credentials,refresh_token
      authorities: openid,roles,scim.write,scim.read
      scope: openid,roles,scim.write,scim.read
  tpsmClients:
    tp_app:
      clientId: tp_app
    tp_cli_app:
      clientId: tp_cli_app
    ensemble_user_service:
      clientId: ensemble_user_service
  jwt:
    activeKeyId: tp
    keys:
      tp:
        alg: RS256
  serviceName: uaa
  servicePort: "8080"
  branding:
    companyName: Broadcom
    productLogo: 
    favIconLogo: 
#@ end
---
apiVersion: v1
kind: Secret
metadata:
  name: tp-values
  namespace: #@ data.values.tp.namespace
stringData:
  #@yaml/text-templated-strings
  data-values.yaml: |
    #@data/values
    ---
    (@= yaml.encode(tp_values())@)
