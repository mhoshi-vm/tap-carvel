    replicas: 1
    replicationFactor: 1
    insyncReplicas: 1
    #@ end
    
    #@overlay/match by=overlay.subset({"kind":"Secret", "metadata": {"name": "ops-kafka-values"}})
    ---
    data:
      #@overlay/replace via=lambda orig, _: base64.encode(yaml.encode(overlay.apply(yaml.decode(base64.decode(orig)),reduce_replica())))
      values.yaml: