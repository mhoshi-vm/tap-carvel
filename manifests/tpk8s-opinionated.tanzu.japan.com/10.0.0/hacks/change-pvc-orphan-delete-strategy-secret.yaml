#@ load("@ytt:data", "data")
---
apiVersion: v1
kind: Secret
metadata:
  name: pvc-owned-for-deletion-strategy-overlay
  namespace: #@ data.values.tp.namespace
stringData:
  #@yaml/text-templated-strings
  pvc-owned-for-deletion-strategy.yaml: |
    #@ load("@ytt:overlay", "overlay")
    #@overlay/match by=overlay.subset({"kind": "PersistentVolumeClaim"}), expects="0+"
    ---
    #@overlay/match missing_ok=True
    metadata:
      #@overlay/match missing_ok=True
      #@overlay/match-child-defaults missing_ok=True
      annotations:
        #@overlay/match missing_ok=True
        kapp.k14s.io/owned-for-deletion: ""
  statefulset-owned-for-deletion-strategy.yaml: |
    #@ load("@ytt:overlay", "overlay")
    #@overlay/match by=overlay.subset({"kind": "StatefulSet"}), expects="0+"
    ---
    #@overlay/match missing_ok=True
    spec:
      #@overlay/match missing_ok=True
      volumeClaimTemplates:
        #@overlay/match by=lambda idx, left, right: "spec" in left, expects="0+"
        #@overlay/match-child-defaults missing_ok=True
        - metadata:
            annotations:
              kapp.k14s.io/owned-for-deletion: ""
  seaweedfs-filer-name.yaml: |
    #@ load("@ytt:overlay", "overlay")
    #@overlay/match by=overlay.subset({"kind": "StatefulSet", "metadata": {"name": "seaweedfs-filer"}}), expects="0+"
    ---
    #@overlay/match missing_ok=True
    spec:
      #@overlay/match missing_ok=True
      volumeClaimTemplates:
        #@overlay/match by=lambda idx, left, right: 0 == idx, expects="0+"
        #@overlay/match-child-defaults missing_ok=True
        - metadata:
            name: data
