#@ load("@ytt:data", "data")
#@ load("@ytt:overlay", "overlay")

#@overlay/match by=overlay.subset({"metadata":{"name":"etcd"}}), expects="2+"
---
metadata:
  namespace: #@ data.values.namespace

#@overlay/match by=overlay.subset({"kind":"StatefulSet", "metadata":{"name":"etcd"}}), expects="1+"
---
spec:
  replicas: #@ data.values.replicas
  template:
    spec:
      #@overlay/match missing_ok=True
      affinity:
        podAntiAffinity:
          #@overlay/remove
          requiredDuringSchedulingIgnoredDuringExecution:
          #@overlay/match missing_ok=True
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: etcd
                topologyKey: kubernetes.io/hostname
              weight: 100
      #@overlay/match missing_ok=True
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        #@overlay/match by="name"
        - name: etcd
          #@overlay/match missing_ok=True
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ "ALL" ]
          image: #@ data.values.image
      #@ if data.values.tls.enabled:
          args:
          - --peer-client-cert-auth
          - --peer-trusted-ca-file=/etc/etcd/certs/server/ca.crt
          - --peer-cert-file=/etc/etcd/certs/server/tls.crt
          - --peer-key-file=/etc/etcd/certs/server/tls.key
          volumeMounts:
          - name: etcd-server-tls
            mountPath: "/etc/etcd/certs/server"
            readOnly: true
      #@overlay/match missing_ok=True
      volumes:
      - name: etcd-server-tls
        secret:
          secretName: etcd-server-tls
          optional: false
      #@ end
---

#@ def add_name(left):
#@ if ( "volumeClaimTemplates" in left ):
volumeClaimTemplates:
  #@ for i in range(len(left["volumeClaimTemplates"])):
  #@overlay/match by=overlay.index(i)
  #@overlay/match-child-defaults missing_ok=True
  - metadata:
      annotations:
        kapp.k14s.io/owned-for-deletion: ""
        #@ if ( "metadata" not in left["volumeClaimTemplates"][i] ) or ("name" not in left["volumeClaimTemplates"][i]["metadata"]):
        name: #@ "data-{}".format(i)
        #@ end
      #@ end
    #@ end
#@ end


#@overlay/match by=overlay.subset({"kind": "StatefulSet"}), expects="0+"
---
#@overlay/match missing_ok=True
#@overlay/replace via=lambda left, right: overlay.apply(left, add_name(left))
spec: